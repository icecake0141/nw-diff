services:
  nw-diff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nw-diff-app
    environment:
      - DEVICE_PASSWORD=${DEVICE_PASSWORD}
      - NW_DIFF_API_TOKEN=${NW_DIFF_API_TOKEN}
      - ENV=${NW_DIFF_ENV:-development}
      - HOSTS_CSV=/app/hosts.csv
      - DB_URL=sqlite:///./data/nw_diff_v2.db
      - ARTIFACT_ROOT=./artifacts_v2
      - TASK_WORKER_ENABLED=true
      - TASK_WORKER_THREADS=1
    volumes:
      # Mount hosts.csv from a secure location
      - ./hosts.csv:/app/hosts.csv:ro
      # Persistent data volumes
      - nw-diff-logs:/app/logs
      - nw-diff-v2-db:/app/data
      - nw-diff-v2-artifacts:/app/artifacts_v2
    networks:
      - nw-diff-network
    restart: unless-stopped
    command: ["uvicorn", "nw_diff_v2.main:app", "--host", "0.0.0.0", "--port", "5000", "--app-dir", "src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/v2').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    container_name: nw-diff-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - ./docker/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - nw-diff
    networks:
      - nw-diff-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nw-diff-logs:
  nw-diff-v2-db:
  nw-diff-v2-artifacts:

networks:
  nw-diff-network:
    driver: bridge
