<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NW-Diff v2 Host Detail</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
      margin: 0;
      padding: 20px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid #d9e2ef;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      background: #0a5bdc;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #2563eb; }
    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #e5e7eb;
    }
    .changed { background: #fde68a; }
    .identical { background: #bfdbfe; }
    .task-box { font-family: Menlo, Monaco, monospace; white-space: pre-wrap; font-size: 12px; }
    input, select {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 8px;
    }
    details {
      border-top: 1px solid #e5e7eb;
      padding-top: 8px;
    }
    .diff-content {
      padding-top: 8px;
    }
    .diff-content.full {
      max-height: none;
      overflow: visible;
    }
    .diff-content.compact {
      max-height: 360px;
      overflow: auto;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .summary-table th,
    .summary-table td {
      border: 1px solid #d9e2ef;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .summary-table th {
      width: 240px;
      background: #f8fafc;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Host Detail: {{ hostname }}</h1>
      <div class="row">
        <a href="/v2">Back to v2</a>
        <select id="view">
          <option value="inline">inline</option>
          <option value="sidebyside" selected>sidebyside</option>
        </select>
        <button class="secondary" id="diffModeToggle" onclick="toggleDiffMode()">Context View</button>
        <button class="secondary" id="displayModeToggle" onclick="toggleDisplayMode()">Display: Full (click for Compact)</button>
        <select id="statusFilter">
          <option value="">all</option>
          <option value="changed">changed</option>
          <option value="identical">identical</option>
          <option value="unavailable">unavailable</option>
          <option value="not_found">not_found</option>
        </select>
        <input id="commandContains" type="text" placeholder="command contains..." style="width:220px;">
        <button onclick="loadDetail()">Reload</button>
        <button class="secondary" onclick="expandAll()">Expand All</button>
        <button class="secondary" onclick="collapseAll()">Collapse All</button>
      </div>
      <div id="summary" class="task-box" style="margin-top:8px;"></div>
    </div>
    <div id="results"></div>
  </div>
  <script>
    const hostname = {{ hostname|tojson }};
    let diffMode = 'full';
    let displayMode = 'full';
    const contextLines = 3;
    const summaryLabels = {
      total_before_filter: 'total_before_filter',
      total: 'total',
      changed: 'changed',
      identical: 'identical',
      unavailable: 'unavailable',
      not_found: 'not_found',
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatBrowserTime(epochSeconds) {
      const parsed = Number(epochSeconds);
      if (!Number.isFinite(parsed) || parsed <= 0) return '-';
      return new Intl.DateTimeFormat('en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      }).format(new Date(parsed * 1000));
    }

    async function loadDetail() {
      const view = document.getElementById('view').value;
      const statusFilter = document.getElementById('statusFilter').value;
      const commandContains = document.getElementById('commandContains').value.trim();
      const summaryBox = document.getElementById('summary');
      const resultWrap = document.getElementById('results');
      try {
        const params = new URLSearchParams({
          view,
          diff_mode: diffMode,
          context_lines: String(contextLines),
        });
        if (statusFilter) params.set('status_filter', statusFilter);
        if (commandContains) params.set('command_contains', commandContains);
        const res = await fetch('/api/v2/hosts/' + encodeURIComponent(hostname) + '/detail?' + params.toString());
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
        renderSummaryTable(summaryBox, data.summary || {});
        const cards = (data.command_results || []).map((item) => {
          const statusClass = item.diff_status === 'changes detected'
            ? 'changed'
            : (item.diff_status === 'identical' ? 'identical' : '');
          return [
            '<div class="card">',
            '<h3>' + escapeHtml(item.command) + '</h3>',
            '<p><span class="status ' + statusClass + '">' + escapeHtml(item.diff_status) + '</span></p>',
            '<p>origin: ' + escapeHtml(item.origin_status) + ' / mtime: ' + escapeHtml(formatBrowserTime(item.origin_mtime)) + '</p>',
            '<p>dest: ' + escapeHtml(item.dest_status) + ' / mtime: ' + escapeHtml(formatBrowserTime(item.dest_mtime)) + '</p>',
            '<details class="diff-details">',
            '<summary>Show Diff</summary>',
            '<div class="diff-content">',
            item.diff_html || '',
            '</div>',
            '</details>',
            '</div>'
          ].join('');
        });
        resultWrap.innerHTML = cards.join('');
        applyDisplayMode(resultWrap);
        expandAll();
      } catch (err) {
        summaryBox.textContent = err.message;
        resultWrap.innerHTML = '';
      }
    }

    function renderSummaryTable(summaryBox, summary) {
      const rows = Object.keys(summaryLabels).map((key) => {
        const raw = summary[key];
        const value = raw === null || raw === undefined ? '-' : String(raw);
        return [
          '<tr>',
          '<th scope="row">' + escapeHtml(summaryLabels[key]) + '</th>',
          '<td>' + escapeHtml(value) + '</td>',
          '</tr>'
        ].join('');
      });
      summaryBox.innerHTML = [
        '<table class="summary-table">',
        '<tbody>',
        rows.join(''),
        '</tbody>',
        '</table>'
      ].join('');
    }

    function updateDiffModeButton() {
      const button = document.getElementById('diffModeToggle');
      if (diffMode === 'context') {
        button.textContent = 'Context View（クリックでFull View）';
      } else {
        button.textContent = 'Full View（クリックでContext View）';
      }
    }

    function toggleDiffMode() {
      diffMode = diffMode === 'full' ? 'context' : 'full';
      updateDiffModeButton();
      loadDetail();
    }

    function applyDisplayMode(root = document) {
      root.querySelectorAll('.diff-content').forEach((el) => {
        el.classList.remove('full', 'compact');
        el.classList.add(displayMode);
      });
    }

    function updateDisplayModeButton() {
      const button = document.getElementById('displayModeToggle');
      button.textContent = displayMode === 'full'
        ? 'Display: Full (click for Compact)'
        : 'Display: Compact (click for Full)';
    }

    function setDisplayMode(mode) {
      displayMode = mode === 'compact' ? 'compact' : 'full';
      updateDisplayModeButton();
      applyDisplayMode(document);
    }

    function toggleDisplayMode() {
      setDisplayMode(displayMode === 'full' ? 'compact' : 'full');
    }

    function expandAll() {
      document.querySelectorAll('.diff-details').forEach((el) => { el.open = true; });
    }

    function collapseAll() {
      document.querySelectorAll('.diff-details').forEach((el) => { el.open = false; });
    }

    document.getElementById('view').addEventListener('change', loadDetail);
    document.getElementById('statusFilter').addEventListener('change', loadDetail);
    document.getElementById('commandContains').addEventListener('input', loadDetail);
    updateDiffModeButton();
    updateDisplayModeButton();
    loadDetail();
  </script>
</body>
</html>
