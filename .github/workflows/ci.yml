name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Security audit (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Validate nginx template syntax
        env:
          SUMMARY_PATH: ${{ github.step_summary }}
          JSON_OUTPUT: .artifacts/deploy_template_validation.json
        run: |
          mkdir -p .artifacts
          sudo apt-get update
          sudo apt-get install -y nginx systemd
          ./scripts/validate-deploy-templates.sh --strict

      - name: Format check (Black)
        run: black --check src tests

      - name: Lint (Pylint)
        run: pylint src tests

      - name: Static analysis (mypy)
        run: mypy src tests

      - name: Run tests
        run: pytest

      - name: Generate candidate v2 contract snapshot
        run: |
          mkdir -p .artifacts
          python scripts/generate-v2-contract.py --output .artifacts/v2_contract_current.json

      - name: Summarize v2 contract snapshot diff
        if: always()
        run: |
          python scripts/diff-v2-contract.py \
            --baseline docs/contract/v2.json \
            --candidate .artifacts/v2_contract_current.json \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --json-output .artifacts/v2_contract_diff.json

      - name: Verify v2 contract snapshot is up to date
        run: |
          python scripts/diff-v2-contract.py \
            --baseline docs/contract/v2.json \
            --candidate .artifacts/v2_contract_current.json \
            --json-output .artifacts/v2_contract_diff_verify.json \
            --fail-on-diff

      - name: V2 API contract smoke check
        env:
          DEVICE_PASSWORD: ci_contract_password
          NW_DIFF_ENV: development
          PYTHON_BIN: python
          CONTRACT_OUTPUT: .artifacts/v2_contract.json
          HEALTH_OUTPUT: .artifacts/v2_health.json
          READINESS_OUTPUT: .artifacts/v2_readiness.json
          LOCKS_OUTPUT: .artifacts/v2_locks.json
          LOG_OUTPUT: .artifacts/v2_contract.log
        run: |
          mkdir -p .artifacts
          ./scripts/check-v2-contract.sh

      - name: V2 readiness check
        if: always()
        run: |
          python scripts/check-v2-readiness.py \
            --input-file .artifacts/v2_readiness.json \
            --summary-path "${GITHUB_STEP_SUMMARY}"

      - name: V2 locks check
        if: always()
        run: |
          python scripts/check-v2-locks.py \
            --input-file .artifacts/v2_locks.json \
            --max-locks 100 \
            --summary-path "${GITHUB_STEP_SUMMARY}"

      - name: Evaluate v2 cutover decision
        if: always()
        env:
          V2_CUTOVER_MAX_QUEUED: "0"
          V2_CUTOVER_MAX_RUNNING: "5"
          V2_CUTOVER_MAX_FAILED: "0"
          V2_CUTOVER_MAX_LOCKED: "0"
        run: |
          python scripts/evaluate-v2-cutover.py \
            --readiness-file .artifacts/v2_readiness.json \
            --contract-diff-file .artifacts/v2_contract_diff.json \
            --deploy-validation-file .artifacts/deploy_template_validation.json \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --json-output .artifacts/v2_cutover_eval.json

      - name: Render v2 cutover notification
        if: always()
        run: |
          python scripts/render-v2-cutover-message.py \
            --input .artifacts/v2_cutover_eval.json \
            --format markdown \
            --output .artifacts/v2_cutover_message.md \
            --summary-path "${GITHUB_STEP_SUMMARY}"
          python scripts/render-v2-cutover-message.py \
            --input .artifacts/v2_cutover_eval.json \
            --format text \
            --output .artifacts/v2_cutover_message.txt

      - name: Summarize v2 contract check
        if: always()
        env:
          PYTHON_BIN: python
          CONTRACT_OUTPUT: .artifacts/v2_contract.json
          HEALTH_OUTPUT: .artifacts/v2_health.json
          READINESS_OUTPUT: .artifacts/v2_readiness.json
          LOCKS_OUTPUT: .artifacts/v2_locks.json
          LOG_OUTPUT: .artifacts/v2_contract.log
        run: ./scripts/summarize-v2-contract.sh

      - name: Upload v2 contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-contract-check
          path: .artifacts/*
          if-no-files-found: warn
