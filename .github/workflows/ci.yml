name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-v2.txt

      - name: Security audit (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Validate nginx template syntax
        env:
          SUMMARY_PATH: ${{ github.step_summary }}
          JSON_OUTPUT: .artifacts/deploy_template_validation.json
        run: |
          mkdir -p .artifacts
          sudo apt-get update
          sudo apt-get install -y nginx systemd
          ./scripts/validate-deploy-templates.sh --strict

      - name: Format check (Black)
        run: black --check src tests

      - name: Lint (Pylint)
        run: pylint src tests

      - name: Static analysis (mypy)
        run: mypy src tests

      - name: V2 migration completion gate
        env:
          PYTHON_BIN: python
          ARTIFACT_DIR: .artifacts
          DEVICE_PASSWORD: ci_contract_password
          NW_DIFF_ENV: development
        run: |
          mkdir -p .artifacts
          bash ./scripts/check-v2-migration-complete.sh

      - name: Run tests (default + v2 scope)
        run: pytest -m "not legacy_v1"

      - name: Run v2 contract + post-check suite
        if: always()
        env:
          ARTIFACT_DIR: .artifacts
          CONTRACT_BASELINE: docs/contract/v2.json
          CONTRACT_CANDIDATE: .artifacts/v2_contract_current.json
          CONTRACT_DIFF: .artifacts/v2_contract_diff.json
          CONTRACT_DIFF_VERIFY: .artifacts/v2_contract_diff_verify.json
          DEVICE_PASSWORD: ci_contract_password
          NW_DIFF_ENV: development
          PYTHON_BIN: python
          CONTRACT_OUTPUT: .artifacts/v2_contract.json
          HEALTH_OUTPUT: .artifacts/v2_health.json
          READINESS_OUTPUT: .artifacts/v2_readiness.json
          LOCKS_OUTPUT: .artifacts/v2_locks.json
          LOG_OUTPUT: .artifacts/v2_contract.log
          SUMMARY_PATH: ${{ github.step_summary }}
          V2_CUTOVER_MAX_QUEUED: "0"
          V2_CUTOVER_MAX_RUNNING: "5"
          V2_CUTOVER_MAX_FAILED: "0"
          V2_CUTOVER_MAX_LOCKED: "0"
        run: ./scripts/run-v2-ci-contract-suite.sh

      - name: Upload v2 contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-contract-check
          path: .artifacts/*
          if-no-files-found: warn
