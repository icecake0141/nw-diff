name: Integration Tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - "requirements*.txt"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - "requirements*.txt"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  # workflow_dispatch intentionally has no paths filter so manual runs always execute
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-v2.txt

      - name: Set up environment variables
        run: |
          # Generate secure tokens for testing
          echo "DEVICE_PASSWORD=test_device_pass_$(openssl rand -hex 8)" >> $GITHUB_ENV
          echo "NW_DIFF_API_TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "NW_DIFF_BASIC_USER=admin" >> $GITHUB_ENV
          echo "NW_DIFF_BASIC_PASSWORD=test_pass_$(openssl rand -hex 8)" >> $GITHUB_ENV
          echo "CERT_HOSTNAME=localhost" >> $GITHUB_ENV
          echo "APP_DEBUG=false" >> $GITHUB_ENV

      - name: Create test hosts.csv
        run: |
          # Create a minimal hosts.csv for testing
          # Note: Column names must match what the code expects (see src/nw_diff/devices.py and app.py)
          # Required columns: host, ip, port, username, model
          cat > hosts.csv << 'EOF'
          host,ip,port,username,model
          test-device,192.0.2.1,22,admin,cisco
          EOF

      - name: Install dependencies for certificate and auth setup
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2-utils openssl nginx systemd

      - name: Validate deploy templates
        env:
          SUMMARY_PATH: ${{ github.step_summary }}
          JSON_OUTPUT: .artifacts/deploy_template_validation.json
        run: ./scripts/validate-deploy-templates.sh --strict

      - name: Generate TLS certificates and .htpasswd
        run: |
          # Run the automated init script to generate certificates and .htpasswd
          ./docker/nginx/init-certs-and-htpasswd.sh

      - name: Verify generated files
        run: |
          echo "Checking generated files..."
          test -f docker/certs/cert.pem || { echo "Certificate not found!"; exit 1; }
          test -f docker/certs/key.pem || { echo "Private key not found!"; exit 1; }
          test -f docker/.htpasswd || { echo ".htpasswd not found!"; exit 1; }
          echo "All required files generated successfully"

      - name: Create .env file for Docker Compose
        run: |
          cat > .env << EOF
          DEVICE_PASSWORD=${DEVICE_PASSWORD}
          NW_DIFF_API_TOKEN=${NW_DIFF_API_TOKEN}
          APP_DEBUG=false
          FLASK_RUN_HOST=0.0.0.0
          FLASK_RUN_PORT=5000
          EOF

      - name: Build Docker images
        run: |
          # Build with timeout and verbose output
          docker compose build --progress=plain
        timeout-minutes: 15

      - name: Start Docker Compose stack
        run: |
          # Start services in detached mode
          docker compose up -d

          # Wait for containers to be healthy
          echo "Waiting for containers to start..."
          sleep 10

          # Check container status
          docker compose ps

          # Show logs for debugging
          echo "=== Flask app logs ==="
          docker compose logs nw-diff
          echo "=== Nginx logs ==="
          docker compose logs nginx

      - name: Check service health
        run: |
          # Wait for services to be running and responding
          timeout=60
          elapsed=0

          echo "Waiting for services to start and respond..."
          while [ $elapsed -lt $timeout ]; do
            # Check if nginx is responding to requests
            if curl -k -s -o /dev/null -w "%{http_code}" https://localhost/ | grep -q "401\|200"; then
              echo "Services are running and responding to requests"
              docker compose ps
              exit 0
            fi
            echo "Waiting for services... ($elapsed/$timeout seconds)"
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Services did not respond in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run integration tests
        env:
          HTTPS_URL: https://localhost
          HTTP_URL: http://localhost
          NW_DIFF_BASIC_USER: admin
          NW_DIFF_BASIC_PASSWORD: ${{ env.NW_DIFF_BASIC_PASSWORD }}
          NW_DIFF_API_TOKEN: ${{ env.NW_DIFF_API_TOKEN }}
        run: |
          # Run the integration test script
          ./scripts/test-integration.sh

      - name: Generate candidate v2 contract snapshot
        if: always()
        run: |
          mkdir -p .artifacts
          python scripts/generate-v2-contract.py --output .artifacts/v2_contract_current.json

      - name: Summarize v2 contract snapshot diff
        if: always() && hashFiles('.artifacts/v2_contract_current.json') != ''
        run: |
          python scripts/diff-v2-contract.py \
            --baseline docs/contract/v2.json \
            --candidate .artifacts/v2_contract_current.json \
            --summary-path "${GITHUB_STEP_SUMMARY}" \
            --json-output .artifacts/v2_contract_diff.json

      - name: Verify v2 contract snapshot is up to date
        if: always() && hashFiles('.artifacts/v2_contract_current.json') != ''
        run: |
          python scripts/diff-v2-contract.py \
            --baseline docs/contract/v2.json \
            --candidate .artifacts/v2_contract_current.json \
            --json-output .artifacts/v2_contract_diff_verify.json \
            --fail-on-diff

      - name: V2 API contract smoke check
        if: always()
        env:
          DEVICE_PASSWORD: ci_contract_password
          NW_DIFF_ENV: development
          PYTHON_BIN: python
          CONTRACT_OUTPUT: .artifacts/v2_contract.json
          HEALTH_OUTPUT: .artifacts/v2_health.json
          READINESS_OUTPUT: .artifacts/v2_readiness.json
          LOCKS_OUTPUT: .artifacts/v2_locks.json
          LOG_OUTPUT: .artifacts/v2_contract.log
        run: |
          mkdir -p .artifacts
          ./scripts/check-v2-contract.sh

      - name: Run v2 post-check bundle
        if: always()
        env:
          PYTHON_BIN: python
          SUMMARY_PATH: ${{ github.step_summary }}
          CONTRACT_OUTPUT: .artifacts/v2_contract.json
          HEALTH_OUTPUT: .artifacts/v2_health.json
          READINESS_OUTPUT: .artifacts/v2_readiness.json
          LOCKS_OUTPUT: .artifacts/v2_locks.json
          LOG_OUTPUT: .artifacts/v2_contract.log
          V2_CUTOVER_MAX_QUEUED: "0"
          V2_CUTOVER_MAX_RUNNING: "5"
          V2_CUTOVER_MAX_FAILED: "0"
          V2_CUTOVER_MAX_LOCKED: "0"
        run: ./scripts/run-v2-ci-postchecks.sh

      - name: Upload v2 contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-v2-contract-check
          path: .artifacts/*
          if-no-files-found: warn

      - name: Test HTTPS endpoint with curl (verbose)
        if: always()
        run: |
          echo "=== Testing HTTPS endpoint ==="
          curl -k -v -u "admin:${NW_DIFF_BASIC_PASSWORD}" https://localhost/ || true

          echo ""
          echo "=== Testing HTTP redirect ==="
          curl -v http://localhost/ || true

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker compose ps

          echo ""
          echo "=== Flask App Logs ==="
          docker compose logs nw-diff

          echo ""
          echo "=== Nginx Logs ==="
          docker compose logs nginx

          echo ""
          echo "=== Container Inspect ==="
          docker inspect nw-diff-app || true
          docker inspect nw-diff-nginx || true

      - name: Cleanup Docker Compose stack
        if: always()
        run: |
          docker compose down -v
          docker compose ps
